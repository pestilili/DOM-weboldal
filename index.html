<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#10024 FIZIKA &#10024</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
</body>
<script>
    let témakörök=[
        "Kinematika",
        "Dinamika",
        "Körmozgás",
        "Rezgőmozgás",
        "Merev test egyensúlya",
        "Forgómozgás",
        "Gravitáció és naprendszer",
        "Hőtan",
        "Halmazállapotváltozás",
        "Folyadékok, gázok mechanikája",
        "Eleketromos mező",
        "Kondenzátor",
        "mágneses mező"
    ]

    const feladatok = [
    { nev: "sebesség", tema: "Kinematika" },
    { nev: "gyorsulás", tema: "Kinematika" },
    { nev: "ketiranyu", tema: "Kinematika" },
    { nev: "korpillango", tema: "Kinematika" },
    { nev: "389", tema: "Dinamika" },
    ];

    const fejecske = document.createElement("header")
    document.body.appendChild(fejecske)

    const testecske = document.createElement("main")
    document.body.appendChild(testecske)

    const cim = document.createElement("h1")
    const cimszoveg = document.createTextNode("Fizika")
    cim.appendChild(cimszoveg)
    fejecske.appendChild(cim)

    const alcim = document.createElement("p")
    const alcimszoveg = document.createTextNode("- szemléltető")
    alcim.appendChild(alcimszoveg)
    fejecske.appendChild(alcim)

    for (let j = 0; j < témakörök.length; j++) {
        const témakör = document.createElement("details") //feljegyzes magamnak későbbre: Ha több detailsem van és szeretném h egymás után csuk nyitódjanak elég egyforma name-t adni nekik. ::marker-el a háromszöget lehet style-olni
        const szum = document.createElement("summary")
        const szumszov = document.createTextNode(témakörök[j])
        szum.appendChild(szumszov)
        témakör.appendChild(szum)

        for (let i = 0; i < 4; i++) {
            const kartya = document.createElement("div")
            const divpeldaszoveg = document.createTextNode(i)
            kartya.appendChild(divpeldaszoveg)
            témakör.appendChild(kartya)
        }
        testecske.appendChild(témakör)
        }

            
</script>
</html>
